name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (for example v0.0.8). Created if missing."
        required: true
        default: "v0.0.8"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ad-hoc signed app
        run: bash scripts/package.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
          else
            echo "No tag to publish" >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "Refusing to publish a non-v* tag: $TAG" >&2
            exit 1
          fi
          if [[ ! -f dist/QuotaBar.zip ]]; then
            echo "dist/QuotaBar.zip was not produced" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --target "$TARGET_SHA"
          fi
          gh release upload "$TAG" "dist/QuotaBar.zip#QuotaBar.zip" --clobber
